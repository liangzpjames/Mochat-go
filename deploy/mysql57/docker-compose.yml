services:
  mysql57:
    image: mysql:5.7
    environment:
      MYSQL_DATABASE: mochat
      MYSQL_ROOT_PASSWORD: mochat_root
      MYSQL_USER: mochat
      MYSQL_PASSWORD: mochat_pass
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-use-native-aio=0
      - --explicit-defaults-for-timestamp=1
    ports:
      - "${MOCHAT_MYSQL57_PORT:-13332}:3306"
    volumes:
      - mysql57-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -umochat -pmochat_pass --silent"]
      interval: 5s
      timeout: 3s
      retries: 40

volumes:
  mysql57-data:
