      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-umochat", "-pmochat_pass"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "${MOCHAT_REDIS_PORT:-26379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  php:
    build:
      context: ../../../mochat/api-server
    environment:
      APP_NAME: mochat
      APP_ENV: production
      DB_DRIVER: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: mochat
      DB_USERNAME: mochat
      DB_PASSWORD: mochat_pass
      DB_CHARSET: utf8mb4
      DB_COLLATION: utf8mb4_unicode_ci
      DB_PREFIX: mc_
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ""
      REDIS_DB: 0
      SIMPLE_JWT_SECRET: "3S6ybWbSy&23fFeq8"
      SIMPLE_JWT_PREFIX: mc_jwt_
      SIDEBAR_JWT_SECRET: Br3LXhp&Ysha1zRDh
      FILE_DRIVER: local
    ports:
      - "${MOCHAT_PHP_PORT:-9501}:9501"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
