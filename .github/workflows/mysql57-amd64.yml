name: mysql57-amd64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mysql57-amd64.yml"
      - "architecture-policy.json"
      - "cmd/mochat-architecture/**"
      - "cmd/mochat-go/**"
      - "cmd/mochat-migrate/**"
      - "cmd/mochat-frontend-e2e/**"
      - "deploy/mysql57/**"
      - "deploy/standalone/**"
      - "migrations/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "web/**"
      - "scripts/frontend_check.ps1"
      - "scripts/frontend_check.sh"
      - "scripts/dev_check.sh"
      - "scripts/test_frontend_check.ps1"
      - "scripts/audit_legacy_frontend_inventory.mjs"
      - "scripts/check_frontend_dependency_policy.mjs"
      - "scripts/test.sh"
      - "scripts/ci_mysql57_amd64.sh"
      - "scripts/audit_architecture_boundaries.sh"
      - "scripts/architecture-size-baseline.txt"
      - "scripts/test_audit_architecture_boundaries.sh"
      - "scripts/test_backend_quality_gate_contract.sh"
      - "scripts/lint_mysql57_schema.sh"
      - "scripts/smoke_mysql57_schema_migrate.sh"
      - "scripts/smoke_schema_migrate.sh"
      - "scripts/standalone_acceptance.sh"
  pull_request:
    paths:
      - ".github/workflows/mysql57-amd64.yml"
      - "architecture-policy.json"
      - "cmd/mochat-architecture/**"
      - "cmd/mochat-go/**"
      - "cmd/mochat-migrate/**"
      - "cmd/mochat-frontend-e2e/**"
      - "deploy/mysql57/**"
      - "deploy/standalone/**"
      - "migrations/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "web/**"
      - "scripts/frontend_check.ps1"
      - "scripts/frontend_check.sh"
      - "scripts/dev_check.sh"
      - "scripts/test_frontend_check.ps1"
      - "scripts/audit_legacy_frontend_inventory.mjs"
      - "scripts/check_frontend_dependency_policy.mjs"
      - "scripts/test.sh"
      - "scripts/ci_mysql57_amd64.sh"
      - "scripts/audit_architecture_boundaries.sh"
      - "scripts/architecture-size-baseline.txt"
      - "scripts/test_audit_architecture_boundaries.sh"
      - "scripts/test_backend_quality_gate_contract.sh"
      - "scripts/lint_mysql57_schema.sh"
      - "scripts/smoke_mysql57_schema_migrate.sh"
      - "scripts/smoke_schema_migrate.sh"
      - "scripts/standalone_acceptance.sh"

jobs:
  mysql57-amd64:
    name: MySQL 5.7 amd64 gate
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend quick gate
        run: ./scripts/frontend_check.sh quick

      - name: Frontend build gate
        run: ./scripts/frontend_check.sh build

      - name: Go architecture gate
        run: go run ./cmd/mochat-architecture -root .

      - name: Architecture wrapper compatibility test
        run: sh ./scripts/test_audit_architecture_boundaries.sh

      - name: Backend quality gate workflow contract
        run: sh ./scripts/test_backend_quality_gate_contract.sh

      - name: Go module race gate
        run: go test -race ./internal/modules/...

      - name: Go tests
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Docker info
        run: docker info

      - name: Migration 0098 lifecycle gate
        env:
          MOCHAT_STACK_PROJECT: mochat-go-schema-migrate-ci
          MOCHAT_MYSQL_PORT: "13331"
        run: bash ./scripts/smoke_schema_migrate.sh

      - name: Architecture boundaries
        run: |
          ./scripts/audit_architecture_boundaries.sh
          ./scripts/test_audit_architecture_boundaries.sh

      - name: Run MySQL 5.7 amd64 gate
        run: |
          mkdir -p docs/phases/phase-pre0-standalone/evidence/ci
          env -u GOROOT ./scripts/ci_mysql57_amd64.sh 2>&1 | tee docs/phases/phase-pre0-standalone/evidence/ci/mysql57-amd64.log
          grep -q "mysql57 amd64 CI gate passed" docs/phases/phase-pre0-standalone/evidence/ci/mysql57-amd64.log

      - name: SCRM MySQL integration gate
        env:
          MOCHAT_STACK_PROJECT: mochat-go-scrm-integration
          MOCHAT_MYSQL57_PORT: "13333"
          MOCHAT_MYSQL_DSN: "mochat:mochat_pass@tcp(127.0.0.1:13333)/mochat?parseTime=true&loc=UTC"
          MOCHAT_REQUIRE_MYSQL_INTEGRATION: "1"
        run: |
          cleanup() {
            docker compose -p "$MOCHAT_STACK_PROJECT" -f deploy/mysql57/docker-compose.yml down -v --remove-orphans
          }
          trap cleanup EXIT

          docker compose -p "$MOCHAT_STACK_PROJECT" -f deploy/mysql57/docker-compose.yml up -d mysql57
          container_id="$(
            docker compose -p "$MOCHAT_STACK_PROJECT" -f deploy/mysql57/docker-compose.yml ps -q mysql57
          )"
          deadline=$((SECONDS + 240))
          status=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id" 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              docker compose -p "$MOCHAT_STACK_PROJECT" -f deploy/mysql57/docker-compose.yml logs --tail=160 mysql57
              exit 1
            fi
            sleep 2
          done
          test "$status" = "healthy"

          go run ./cmd/mochat-migrate -dsn "$MOCHAT_MYSQL_DSN" -project-root . -action apply
          test "$(
            docker compose -p "$MOCHAT_STACK_PROJECT" -f deploy/mysql57/docker-compose.yml \
              exec -T mysql57 mysql -umochat -pmochat_pass -N -B mochat \
              -e "SELECT COUNT(*) FROM mochat_go_schema_migrations WHERE version = '0098_scrm_lead_foundation'"
          )" = "1"
          go test -v -count=1 -tags=integration ./internal/modules/scrm/adapters/mysql

      - name: Install Playwright Chromium
        run: pnpm --filter @mochat/e2e exec playwright install --with-deps chromium

      - name: Frontend browser gate
        run: ./scripts/frontend_check.sh e2e

      - name: Upload MySQL 5.7 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysql57-amd64-evidence
          path: docs/phases/phase-pre0-standalone/evidence/ci/mysql57-amd64.log
          if-no-files-found: error
