name: mysql57-amd64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mysql57-amd64.yml"
      - "cmd/mochat-migrate/**"
      - "cmd/mochat-frontend-e2e/**"
      - "deploy/mysql57/**"
      - "deploy/standalone/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "web/**"
      - "scripts/frontend_check.ps1"
      - "scripts/frontend_check.sh"
      - "scripts/test_frontend_check.ps1"
      - "scripts/audit_legacy_frontend_inventory.mjs"
      - "scripts/check_frontend_dependency_policy.mjs"
      - "scripts/test.sh"
      - "scripts/ci_mysql57_amd64.sh"
      - "scripts/audit_architecture_boundaries.sh"
      - "scripts/architecture-size-baseline.txt"
      - "scripts/test_audit_architecture_boundaries.sh"
      - "scripts/lint_mysql57_schema.sh"
      - "scripts/smoke_mysql57_schema_migrate.sh"
      - "scripts/standalone_acceptance.sh"
  pull_request:
    paths:
      - ".github/workflows/mysql57-amd64.yml"
      - "cmd/mochat-migrate/**"
      - "cmd/mochat-frontend-e2e/**"
      - "deploy/mysql57/**"
      - "deploy/standalone/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "web/**"
      - "scripts/frontend_check.ps1"
      - "scripts/frontend_check.sh"
      - "scripts/test_frontend_check.ps1"
      - "scripts/audit_legacy_frontend_inventory.mjs"
      - "scripts/check_frontend_dependency_policy.mjs"
      - "scripts/test.sh"
      - "scripts/ci_mysql57_amd64.sh"
      - "scripts/audit_architecture_boundaries.sh"
      - "scripts/architecture-size-baseline.txt"
      - "scripts/test_audit_architecture_boundaries.sh"
      - "scripts/lint_mysql57_schema.sh"
      - "scripts/smoke_mysql57_schema_migrate.sh"
      - "scripts/standalone_acceptance.sh"

jobs:
  mysql57-amd64:
    name: MySQL 5.7 amd64 gate
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend quick gate
        run: ./scripts/frontend_check.sh quick

      - name: Frontend build gate
        run: ./scripts/frontend_check.sh build

      - name: Go tests
        run: go test ./...

      - name: Docker info
        run: docker info

      - name: Architecture boundaries
        run: |
          ./scripts/audit_architecture_boundaries.sh
          ./scripts/test_audit_architecture_boundaries.sh

      - name: Run MySQL 5.7 amd64 gate
        run: |
          mkdir -p docs/evidence/ci
          env -u GOROOT ./scripts/ci_mysql57_amd64.sh 2>&1 | tee docs/evidence/ci/mysql57-amd64.log
          grep -q "mysql57 amd64 CI gate passed" docs/evidence/ci/mysql57-amd64.log

      - name: Install Playwright Chromium
        run: pnpm --filter @mochat/e2e exec playwright install --with-deps chromium

      - name: Frontend browser gate
        run: ./scripts/frontend_check.sh e2e

      - name: Upload MySQL 5.7 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysql57-amd64-evidence
          path: docs/evidence/ci/mysql57-amd64.log
          if-no-files-found: error
